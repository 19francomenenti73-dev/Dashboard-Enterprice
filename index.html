<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nowcasting Italia — Dashboard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030712;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Header Fisso Sicuro */
    .bridge-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: #080e1c;
      border-bottom: 2px solid #00f0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 10;
    }

    /* Scritta Nowcasting Italia Dashboard in blu che pulsa */
    .pulsing-title {
      font-size: 11px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: blue-pulse 2s infinite ease-in-out;
    }

    @keyframes blue-pulse {
      0% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
      50% { opacity: 1; text-shadow: 0 0 14px rgba(0,240,255,0.9), 0 0 22px rgba(0,240,255,0.5); }
      100% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
    }

    .status-ok {
      font-size: 8px;
      color: #4ade80;
      font-weight: 800;
    }

    /* Barra Navigazione Tattica */
    .tactical-nav {
      position: absolute;
      top: 44px; left: 0; right: 0;
      height: 44px;
      background: #0d1527;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      gap: 6px;
      padding: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }

    .tactical-btn {
      background: rgba(13, 25, 48, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tactical-btn.active {
      background: #00f0ff;
      color: #030712;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    }

    .tactical-btn.amber { border-color: #facc15; color: #facc15; }
    .tactical-btn.amber.active { background: #facc15; color: #030712; box-shadow: 0 0 10px rgba(250, 204, 21, 0.8); }

    .tactical-btn.alert { border-color: #ff2a5f; color: #ff2a5f; }
    .tactical-btn.alert.active { background: #ff2a5f; color: #fff; box-shadow: 0 0 10px rgba(255, 42, 95, 0.8); }

    /* Schermo Principale (Posizionamento assoluto a prova di collasso mobile) */
    .viewscreen-container {
      position: absolute;
      top: 88px; 
      bottom: 0; 
      left: 0; 
      right: 0;
      background: #000;
    }

    #viewscreen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header class="bridge-header">
    <div class="pulsing-title">Nowcasting Italia Dashboard</div>
    <div class="status-ok">● TACTICAL OK</div>
  </header>

  <nav class="tactical-nav">
    <button class="tactical-btn active" onclick="switchTracker('https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/', this)">
      ⚡ Global Chaser
    </button>
    <button class="tactical-btn amber" onclick="switchTracker('https://19francomenenti73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/', this)">
      🛰️ Storm Tracker
    </button>
    <button class="tactical-btn alert" onclick="switchTracker('https://19francomenenti73-dev.github.io/NOWCASTING-ITALIA-TITAN-CONVECTIVE-TRACKER/', this)">
      🌐 Mesoscale TITAN
    </button>
    <button class="tactical-btn" onclick="switchTracker('./global-centroids.html', this)">
      🌍 Centroids
    </button>
    <button class="tactical-btn" onclick="switchTracker('./regional-cells.html', this)">
      🇮🇹 Regional
    </button>
  </nav>

  <div class="viewscreen-container">
    <iframe id="viewscreen-iframe" src="https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/" allowfullscreen></iframe>
  </div>

  <script>
    function switchTracker(url, btnElement) {
      document.getElementById('viewscreen-iframe').src = url;
      document.querySelectorAll('.tactical-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
