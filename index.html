<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U.S.S. Discovery — Conning Tower | Nowcasting Italia</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #0d1527 0%, #050811 60%, #020307 100%);
      color: #00f0ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bridge Header - Stile Console Avanzata */
    .bridge-header {
      height: 48px;
      background: linear-gradient(180deg, #111b33 0%, #080e1c 100%);
      border-bottom: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
    }
    .bridge-logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bridge-led {
      width: 8px;
      height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f0ff;
      animation: pulse-led 2s infinite;
    }
    @keyframes pulse-led {
      0% { opacity: 0.4; box-shadow: 0 0 5px #00f0ff; }
      50% { opacity: 1; box-shadow: 0 0 15px #00f0ff; }
      100% { opacity: 0.4; box-shadow: 0 0 5px #00f0ff; }
    }
    .bridge-title {
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    }
    .bridge-sub {
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 1.5px;
    }

    /* Griglia Operativa Principale */
    .bridge-deck {
      flex: 1;
      display: grid;
      grid-template-columns: 230px 1fr 220px;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 78px);
    }

    /* Pannello Sinistro: Pulsanti Tattici LCARS */
    .tactical-console {
      background: linear-gradient(135deg, rgba(13, 21, 39, 0.9) 0%, rgba(5, 8, 17, 0.95) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-left: 4px solid #00f0ff;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .tactical-btn {
      background: linear-gradient(90deg, rgba(13, 25, 48, 0.8) 0%, rgba(20, 35, 66, 0.6) 100%);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      padding: 11px 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .tactical-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: #00f0ff;
      opacity: 0.5;
    }

    .tactical-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateX(4px);
      color: #fff;
    }

    .tactical-btn.active {
      background: linear-gradient(90deg, #00f0ff 0%, #0099ff 100%);
      color: #030712;
      border-color: #fff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
      font-weight: 900;
    }
    .tactical-btn.active::before { background: #030712; }

    /* Variazioni cromatiche stile plancia */
    .tactical-btn.amber {
      border-color: rgba(250, 204, 21, 0.5);
      color: #facc15;
    }
    .tactical-btn.amber::before { background: #facc15; }
    .tactical-btn.amber:hover { background: rgba(250, 204, 21, 0.2); border-color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
    .tactical-btn.amber.active { background: linear-gradient(90deg, #facc15 0%, #ca8a04 100%); color: #030712; box-shadow: 0 0 20px rgba(250, 204, 21, 0.8); }

    .tactical-btn.alert {
      border-color: rgba(255, 42, 95, 0.6);
      color: #ff2a5f;
    }
    .tactical-btn.alert::before { background: #ff2a5f; }
    .tactical-btn.alert:hover { background: rgba(255, 42, 95, 0.2); border-color: #ff2a5f; box-shadow: 0 0 15px rgba(255, 42, 95, 0.5); }
    .tactical-btn.alert.active { background: linear-gradient(90deg, #ff2a5f 0%, #be123c 100%); color: #fff; box-shadow: 0 0 20px rgba(255, 42, 95, 0.9); }

    /* Viewscreen Centrale (Cornice Olografica) */
    .viewscreen-container {
      position: relative;
      background: #020408;
      border: 3px solid #00f0ff;
      border-radius: 14px;
      box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.2), 0 0 30px rgba(0, 240, 255, 0.25);
      overflow: hidden;
    }

    /* Effetto scanline stile monitor CRT tattico */
    .viewscreen-container::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.6;
    }

    #conning-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Pannello Destro: Telemetria Avanzata */
    .telemetry-console {
      background: linear-gradient(135deg, rgba(13, 21, 39, 0.9) 0%, rgba(5, 8, 17, 0.95) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-right: 4px solid #00f0ff;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 10px;
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .telemetry-group {
      border-bottom: 1px dashed rgba(0, 240, 255, 0.25);
      padding-bottom: 10px;
    }
    .t-label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .t-key { color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .t-val { font-weight: 900; color: #00f0ff; letter-spacing: 0.5px; }
    .t-val.green { color: #4ade80; text-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }
    .t-val.red { color: #ff2a5f; text-shadow: 0 0 8px rgba(255, 42, 95, 0.6); }

    /* Barra Inferiore */
    .bridge-footer {
      height: 30px;
      background: #020307;
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 9px;
      letter-spacing: 2.5px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
    }

    /* Ottimizzazione Mobile */
    @media (max-width: 950px) {
      .bridge-deck {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
      }
      .telemetry-console { display: none; }
      .tactical-console { flex-direction: row; flex-wrap: wrap; }
      .tactical-btn { flex: 1; min-width: 140px; text-align: center; justify-content: center; }
      .tactical-btn::before { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Bridge Header -->
  <header class="bridge-header">
    <div class="bridge-logo-area">
      <div class="bridge-led"></div>
