  <title>Nowcasting Italia — Dashboard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030712;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Header Fisso Sicuro */
    .bridge-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: #080e1c;
      border-bottom: 2px solid #00f0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 10;
    }

    /* Scritta Nowcasting Italia Dashboard in blu che pulsa */
    .pulsing-title {
      font-size: 11px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: blue-pulse 2s infinite ease-in-out;
    }

    @keyframes blue-pulse {
      0% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
      50% { opacity: 1; text-shadow: 0 0 14px rgba(0,240,255,0.9), 0 0 22px rgba(0,240,255,0.5); }
      100% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

      font-size: 8px;
      color: #4ade80;
      font-weight: 800;
    }
