<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U.S.S. Discovery — Conning Tower</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #02040a;
      color: #00f0ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bridge Bar */
    .bridge-topbar {
      height: 42px;
      background: linear-gradient(180deg, #0b1329 0%, #040814 100%);
      border-bottom: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
    }
    .top-brand { font-size: 11px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,240,255,0.8); }
    .top-sub { font-size: 8px; color: #94a3b8; letter-spacing: 1px; }

    /* Main Bridge Console Layout (3 Colonne) */
    .bridge-console {
      flex: 1;
      display: grid;
      grid-template-columns: 210px 1fr 210px;
      gap: 10px;
      padding: 10px;
      height: calc(100vh - 74px);
      background: radial-gradient(circle at center, #091022 0%, #03060f 100%);
    }

    /* Pannello Sinistro: Pulsanti Tattici LCARS Verticali */
    .left-tactical {
      background: rgba(8, 14, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-left: 3px solid #00f0ff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,240,255,0.08);
    }

    .lcars-btn {
      background: rgba(10, 18, 36, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 6px;
      padding: 10px 8px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
    }

    .lcars-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      color: #fff;
    }

    .lcars-btn.active {
      background: #00f0ff;
      color: #02040a;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.9);
      font-weight: 900;
    }

    /* Variazioni Colore Pulsanti (Ambra / Rosso Allarme) */
    .lcars-btn.amber { border-color: #facc15; color: #facc15; }
    .lcars-btn.amber:hover { background: rgba(250,204,21,0.2); box-shadow: 0 0 15px rgba(250,204,21,0.6); }
    .lcars-btn.amber.active { background: #facc15; color: #02040a; box-shadow: 0 0 20px rgba(250,204,21,0.9); }

    .lcars-btn.alert { border-color: #ff2a5f; color: #ff2a5f; }
    .lcars-btn.alert:hover { background: rgba(255,42,95,0.2); box-shadow: 0 0 15px rgba(255,42,95,0.6); }
    .lcars-btn.alert.active { background: #ff2a5f; color: #fff; box-shadow: 0 0 20px rgba(255,42,95,0.9); }

    /* Schermo Centrale: Cornice Olografica Angolata */
    .viewscreen-frame {
      position: relative;
      background: #000;
      border: 3px solid #00f0ff;
      border-radius: 12px;
      clip-path: polygon(
        0% 0%, 
        100% 0%, 
        100% calc(100% - 14px), 
        calc(100% - 14px) 100%, 
        0% 100%
      );
      box-shadow: inset 0 0 35px rgba(0, 240, 255, 0.25), 0 0 25px rgba(0, 240, 255, 0.3);
      overflow: hidden;
    }

    #bridge-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Pannello Destro: Telemetria e Monitoraggio */
    .right-telemetry {
      background: rgba(8, 14, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-right: 3px solid #00f0ff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 9px;
      box-shadow: inset 0 0 15px rgba(0,240,255,0.08);
    }

    .t-box {
      border-bottom: 1px dashed rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
    }
    .t-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .t-key { color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .t-val { font-weight: 900; color: #00f0ff; }
    .t-val.green { color: #4ade80; text-shadow: 0 0 6px rgba(74,222,128,0.6); }
    .t-val.red { color: #ff2a5f; text-shadow: 0 0 6px rgba(255,42,95,0.6); }

    /* Bottom Ticker Bar */
    .bridge-footer {
      height: 32px;
      background: #02040a;
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 8px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
    }

    /* Responsive Mobile: Adattamento pulito e senza scompensi */
    @media (max-width: 850px) {
      .bridge-console {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
      }
      .right-telemetry { display: none; }
      .left-tactical { flex-direction: row; flex-wrap: wrap; }
      .lcars-btn { flex: 1; min-width: 120px; font-size: 8px; padding: 8px 4px; }
      .viewscreen-frame { min-height: 65vh; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="bridge-topbar">
    <div>
      <div class="top-brand">U.S.S. Discovery — Conning Tower</div>
      <div class="top-sub">Nowcasting Italia Master Control</div>
    </div>
    <div style="font-size: 8px; color: #4ade80; font-weight: 900; letter-spacing: 1px;">● SENSORS ACTIVE</div>
  </header>

  <!-- Console Centrale -->
  <div class="bridge-console">
    
    <!-- Pannello Sinistro (Bottoni Tattici) -->
    <nav class="left-tactical">
      <button class="lcars-btn active" onclick="switchSystem('https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/', this)">
        [ GLOBAL CHASER ]
      </button>

      <button class="lcars-btn amber" onclick="switchSystem('https://19francomenenti73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/', this)">
        [ STORM TRACKER ]
      </button>

      <button class="lcars-btn alert" onclick="switchSystem('https://19francomenenti73-dev.github.io/NOWCASTING-ITALIA-TITAN-CONVECTIVE-TRACKER/', this)">
        [ MESOSCALE TITAN ]
      </button>

      <button class="lcars-btn" onclick="switchSystem('./global-centroids.html', this)">
        [ GLOBAL CENTROIDS ]
      </button>

      <button class="lcars-btn" onclick="switchSystem('./regional-cells.html', this)">
        [ REGIONAL RADAR ]
      </button>
    </nav>

    <!-- Schermo Centrale (Viewscreen) -->
    <main class="viewscreen-frame">
      <iframe id="bridge-iframe" src="https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/" allowfullscreen></iframe>
    </main>

    <!-- Pannello Destro (Telemetria) -->
    <aside class="right-telemetry">
      <div class="t-box">
        <div class="t-row"><span class="t-key">Power Core:</span><span class="t-val green">NOMINAL</span></div>
        <div class="t-row"><span class="t-key">Tactical Array:</span><span class="t-val green">ACTIVE</span></div>
        <div class="t-row"><span class="t-key">Main Link:</span><span class="t-val green">ONLINE</span></div>
      </div>

      <div class="t-box">
        <div class="t-row"><span class="t-key">Sector Grid:</span><span class="t-val">EUROPE / IT</span></div>
        <div class="t-row"><span class="t-key">Scan Status:</span><span class="t-val green">SECURED</span></div>
      </div>

      <div style="margin-top: auto; text-align: center; font-size: 7px; color: #475569;">
        DISCOVERY CORE v5.0<br>STORM CHASERS ONLY
      </div>
    </aside>

  </div>

  <!-- Footer Ticker -->
  <footer class="bridge-footer">
    Command Viewscreen — "Discovery" Tribute // For Storm Chasers Only
  </footer>

  <script>
    function switchSystem(url, btnElement) {
      document.getElementById('bridge-iframe').src = url;
      document.querySelectorAll('.lcars-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
