<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U.S.S. Discovery — Conning Tower | Nowcasting Italia</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      background: #030712;
      color: #38bdf8;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra Superiore Plancia */
    .bridge-header {
      height: 42px;
      background: linear-gradient(180deg, #090d16 0%, #030712 100%);
      border-bottom: 2px solid rgba(56, 189, 248, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      z-index: 100;
    }
    .bridge-title {
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .bridge-sub {
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    /* Griglia Operativa Principale */
    .bridge-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 72px);
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
    }

    /* Pannello Sinistro: Controlli Tattici LCARS */
    .tactical-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.08);
    }

    .tactical-btn {
      background: rgba(15, 23, 42, 0.95);
      color: #38bdf8;
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      border-radius: 6px;
      padding: 10px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tactical-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: translateX(3px);
    }

    .tactical-btn.active {
      background: #38bdf8;
      color: #030712;
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
    }

    /* Pulsante d'allarme / speciale */
    .tactical-btn.alert-mode {
      border-color: rgba(244, 63, 94, 0.6);
      color: #f43f5e;
    }
    .tactical-btn.alert-mode:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
    }
    .tactical-btn.alert-mode.active {
      background: #f43f5e;
      color: #fff;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.9);
    }

    /* Viewscreen Centrale Olografico */
    .viewscreen-frame {
      position: relative;
      border: 3px solid #38bdf8;
      border-radius: 16px;
      clip-path: polygon(
        0% 0%, 
        100% 0%, 
        100% calc(100% - 15px), 
        calc(100% - 15px) 100%, 
        0% 100%
      );
      box-shadow: inset 0 0 35px rgba(56, 189, 248, 0.25), 0 0 25px rgba(56, 189, 248, 0.3);
      background: #050b14;
      overflow: hidden;
    }

    #viewscreen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Pannello Destro: Telemetria e Monitoraggio */
    .telemetry-panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 10px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.08);
    }

    .telemetry-section {
      border-bottom: 1px dashed rgba(56, 189, 248, 0.25);
      padding-bottom: 8px;
    }
    .t-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .t-key { color: #94a3b8; font-weight: 600; }
    .t-val { font-weight: 800; color: #38bdf8; }
    .t-val.green { color: #4ade80; }
    .t-val.red { color: #f43f5e; }

    /* Barra Inferiore Targa */
    .bridge-footer {
      height: 30px;
      background: #030712;
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 9px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
    }

    /* Responsive Mobile */
    @media (max-width: 900px) {
      .bridge-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
      }
      .telemetry-panel { display: none; }
      .tactical-panel { flex-direction: row; flex-wrap: wrap; }
      .tactical-btn { flex: 1; min-width: 130px; text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Barra Superiore -->
  <header class="bridge-header">
    <div class="bridge-title">U.S.S. Discovery — Conning Tower</div>
    <div class="bridge-sub">Nowcasting Italia Master Control</div>
  </header>

  <!-- Griglia della Plancia -->
  <div class="bridge-grid">
    
    <!-- Pannello Pulsanti Tattici (Sinistra) -->
    <nav class="tactical-panel">
      <button class="tactical-btn active" onclick="switchChannel('https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/', this)">
        ⚡ Global Chaser
      </button>

      <button class="tactical-btn" onclick="switchChannel('https://19francomenenti73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/', this)">
        🛰️ Storm Tracker Reale
      </button>

      <button class="tactical-btn alert-mode" onclick="switchChannel('https://19francomenenti73-dev.github.io/NOWCASTING-ITALIA-TITAN-CONVECTIVE-TRACKER/', this)">
        🌐 Mesoscale TITAN 3D
      </button>

      <button class="tactical-btn" onclick="switchChannel('./global-centroids.html', this)">
        🌍 Global Centroids
      </button>

      <button class="tactical-btn" onclick="switchChannel('./regional-cells.html', this)">
        🇮🇹 Regional Radar
      </button>
    </nav>

    <!-- Viewscreen Centrale (Iframe) -->
    <main class="viewscreen-wrapper viewscreen-frame">
      <iframe id="viewscreen-iframe" src="https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/" allowfullscreen></iframe>
    </main>

    <!-- Pannello Telemetria Tattica (Destra) -->
    <aside class="telemetry-panel">
      <div class="telemetry-section">
        <div class="t-row"><span class="t-key">POWER:</span><span class="t-val green">NOMINAL</span></div>
        <div class="t-row"><span class="t-key">SENSORS:</span><span class="t-val green">ACTIVE</span></div>
        <div class="t-row"><span class="t-key">TRACKER:</span><span class="t-val green">ONLINE</span></div>
      </div>
      
      <div class="telemetry-section">
        <div class="t-row"><span class="t-key">GRID LOCK:</span><span class="t-val">EUROPE / IT</span></div>
        <div class="t-row"><span class="t-key">RADAR SYNC:</span><span class="t-val green">LIVE</span></div>
      </div>

      <div style="margin-top: auto; font-size: 8px; color: #64748b; text-align: center;">
        SYSTEM REL. 2026.10<br>ORBITAL LINK SECURED
      </div>
    </aside>

  </div>

  <!-- Barra di Stato Inferiore -->
  <footer class="bridge-footer">
    Command Viewscreen — "Discovery" Tribute // For Storm Chasers Only
  </footer>

  <script>
    function switchChannel(targetUrl, btnElement) {
      document.getElementById('viewscreen-iframe').src = targetUrl;
      document.querySelectorAll('.tactical-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
