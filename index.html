<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U.S.S. Discovery — Conning Tower</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #02040a;
      color: #00f0ff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Top Bridge Header */
    .bridge-topbar {
      width: 100%;
      height: 48px;
      background: linear-gradient(180deg, #0b1329 0%, #040814 100%);
      border-bottom: 2px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    /* Logo Vettoriale Pulsante in Blu Elettrico */
    .brand-logo-container {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .pulsing-logo {
      height: 36px;
      width: 36px;
      animation: electric-pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.7));
    }
    @keyframes electric-pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.5)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(0, 240, 255, 1)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.5)); }
    }

    /* Badge di Stato con LED Verde Pulsante */
    .status-badge {
      font-size: 8px;
      color: #4ade80;
      font-weight: 900;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-led {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: led-blink 1.5s infinite;
    }
    @keyframes led-blink {
      0% { opacity: 0.3; }
      50% { opacity: 1; box-shadow: 0 0 12px #4ade80; }
      100% { opacity: 0.3; }
    }

    /* Barra Navigazione Tattica (Scorribile) */
    .tactical-nav {
      width: 100%;
      height: 44px;
      background: #080e1c;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      gap: 6px;
      padding: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .lcars-btn {
      background: rgba(10, 18, 36, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.5);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .lcars-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      color: #fff;
    }

    .lcars-btn.active {
      background: #00f0ff;
      color: #02040a;
      font-weight: 900;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.9);
      border-color: #fff;
    }

    .lcars-btn.amber { border-color: #facc15; color: #facc15; }
    .lcars-btn.amber.active { background: #facc15; color: #02040a; box-shadow: 0 0 12px rgba(250, 204, 21, 0.9); }

    .lcars-btn.alert { border-color: #ff2a5f; color: #ff2a5f; }
    .lcars-btn.alert.active { background: #ff2a5f; color: #fff; box-shadow: 0 0 12px rgba(255, 42, 95, 0.9); }

    /* Schermo Principale Viewscreen */
    .viewscreen-container {
      width: 100%;
      height: calc(100vh - 92px);
      background: #000;
    }

    #bridge-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Bar con Logo Pulsante e Stato Tattico -->
  <header class="bridge-topbar">
    <div class="brand-logo-container">
      <!-- Logo
