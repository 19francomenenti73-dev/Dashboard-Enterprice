<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nowcasting Italia — Dashboard</title>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    /* Blocchiamo totalmente lo scroll alla radice */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #030712;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden !important;
      position: fixed;
      inset: 0;
    }

    /* Header Compatto Fisso in alto */
    .bridge-header {
      width: 100%;
      height: 38px;
      min-height: 38px;
      background: #080e1c;
      border-bottom: 2px solid #00f0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
      z-index: 10;
    }

    .pulsing-title {
      font-size: 10px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blue-pulse 2s infinite ease-in-out;
    }

    @keyframes blue-pulse {
      0% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
      50% { opacity: 1; text-shadow: 0 0 12px rgba(0,240,255,0.9); }
      100% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-ok {
      font-size: 8px;
      color: #4ade80;
      font-weight: 800;
    }

    .audio-tactical-btn {
      background: rgba(8, 14, 28, 0.9);
      border: 1px solid #4ade80;
      color: #4ade80;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }

    .audio-tactical-btn.playing {
      border-color: #ff2a5f;
      color: #ff2a5f;
    }

    /* Barra Navigazione Compatta Scorrevole in orizzontale */
    .tactical-nav {
      width: 100%;
      height: 38px;
      min-height: 38px;
      background: #0d1527;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      z-index: 10;
    }

    .tactical-btn {
      background: rgba(13, 25, 48, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tactical-btn.active {
      background: #00f0ff;
      color: #030712;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .tactical-btn.amber { border-color: #facc15; color: #facc15; }
    .tactical-btn.amber.active { background: #facc15; color: #030712; box-shadow: 0 0 8px rgba(250, 204, 21, 0.8); }

    .tactical-btn.alert { border-color: #ff2a5f; color: #ff2a5f; }
    .tactical-btn.alert.active { background: #ff2a5f; color: #fff; box-shadow: 0 0 8px rgba(255, 42, 95, 0.8); }

    /* Contenitore Mappa calibrato al millimetro per non sforare */
    .viewscreen-container {
      width: 100%;
      height: calc(100dvh - 76px);
      background: #000;
      overflow: hidden;
      flex-grow: 1;
    }

    #viewscreen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header class="bridge-header">
    <div class="pulsing-title">Nowcasting Italia Dashboard</div>
    <div class="header-right-group">
      <button id="audio-btn" class="audio-tactical-btn" onclick="toggleMusic()" title="Colonna Sonora">🔊</button>
      <div class="status-ok">● OK</div>
    </div>
  </header>

  <audio id="tactical-audio" src="https://files.catbox.moe/ltr70o.mp3" loop preload="auto"></audio>

  <nav class="tactical-nav">
    <button class="tactical-btn active" onclick="switchTracker('https://19francomenenti73-dev.github.io/Dashboard-Enterprise/3d-mesoscale.html', this)">⚡ 3D Mesoscala</button>
    <button class="tactical-btn amber" onclick="switchTracker('https://19francomenenti73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/', this)">🛰️ Storm Tracker</button>
    <button class="tactical-btn amber" onclick="switchTracker('https://19francomenenti73-dev.github.io/Snow-tracker/', this)">❄️ Snow Tracker</button>
    <button class="tactical-btn alert" onclick="switchTracker('https://19francomenenti73-dev.github.io/NOWCASTING-ITALIA-TITAN-CONVECTIVE-TRACKER/', this)">🌐 Mesoscale TITAN</button>
    <button class="tactical-btn" onclick="switchTracker('https://19francomenenti73-dev.github.io/Dashboard-Enterprise/global-centroids.html', this)">🌍 Centroids</button>
    <button class="tactical-btn alert" onclick="switchTracker('https://19francomenenti73-dev.github.io/archivio-eventi/', this)">📍 Archivio Eventi</button>
  </nav>

  <div class="viewscreen-container">
    <iframe id="viewscreen-iframe" src="https://19francomenenti73-dev.github.io/Dashboard-Enterprise/3d-mesoscale.html" allowfullscreen></iframe>
  </div>

  <script>
    function switchTracker(url, btnElement) {
      document.getElementById('viewscreen-iframe').src = url;
      document.querySelectorAll('.tactical-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function toggleMusic() {
      const audio = document.getElementById('tactical-audio');
      const btn = document.getElementById('audio-btn');

      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add('playing');
          btn.innerText = '🎶';
        }).catch(err => console.log(err));
      } else {
        audio.pause();
        btn.classList.remove('playing');
        btn.innerText = '🔊';
      }
    }
  </script>

</body>
</html>
