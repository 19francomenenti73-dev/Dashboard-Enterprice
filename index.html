<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia - Master Control Dashboard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Plancia di Comando Stile Star Trek Discovery */
    .command-header {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(9, 13, 22, 0.95) 100%);
      border-bottom: 2px solid rgba(56, 189, 248, 0.4);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* Pulsanti della Plancia (5 Selezioni) */
    .control-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 41, 59, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .tab-btn.active {
      background: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    /* Viewscreen Principale */
    .viewscreen-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: #05070b;
      border: 4px solid #1e293b;
      border-top: none;
    }

    #tracker-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Status Bar Inferiore */
    .command-footer {
      background: #05070b;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 16px;
      font-size: 9px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Plancia di Comando Superiore -->
  <header class="command-header">
    <div class="brand-section">
      <div>
        <div class="brand-title">U.S.S. Discovery — Conning Tower</div>
        <div class="brand-subtitle">Nowcasting Italia Master Control</div>
      </div>
    </div>

    <div class="control-tabs">
      <button class="tab-btn active" onclick="switchTracker('https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/', this)">
        ⚡ Global Chaser
      </button>
      <button class="tab-btn" onclick="switchTracker('https://19francomenenti73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/', this)">
        🛰️ Storm Tracker Reale
      </button>
      <button class="tab-btn" onclick="switchTracker('https://19francomenenti73-dev.github.io/NOWCASTING-ITALIA-TITAN-CONVECTIVE-TRACKER/', this)">
        🌐 Mesoscale TITAN 3D
      </button>
      <button class="tab-btn" onclick="switchTracker('./global-centroids.html', this)">
        🌍 Global Centroids
      </button>
      <button class="tab-btn" onclick="switchTracker('./regional-cells.html', this)">
        🇮🇹 Regional Radar
      </button>
    </div>
  </header>

  <!-- Schermo Principale (Iframe) -->
  <div class="viewscreen-container">
    <iframe id="tracker-frame" src="https://19francomenenti73-dev.github.io/nowcasting-italia-3d-storm-chaser-track/" allowfullscreen></iframe>
  </div>

  <!-- Barra di Stato -->
  <footer class="command-footer">
    <span>Tactical Sensors: Online</span>
    <span>Sistemi Attivi: 5/5</span>
    <span>For Storm Chasers Only</span>
  </footer>

  <script>
    function switchTracker(url, btnElement) {
      document.getElementById('tracker-frame').src = url;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
