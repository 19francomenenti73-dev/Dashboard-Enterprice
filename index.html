<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia — Pannello di Controllo</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Barra superiore stile Dashboard Nowcasting Italia */
    .dashboard-header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      position: relative;
    }

    .dashboard-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .tracker-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tracker-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tracker-btn:hover, .tracker-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    /* Mappa */
    #map {
      width: 100%;
      height: calc(100vh - 95px);
      background: #0b0f19;
    }
  </style>
</head>
<body>

  <!-- Barra superiore di navigazione tra i tracker del sito -->
  <div class="dashboard-header">
    <div class="dashboard-title-row">
      <span>❄ NOWCASTING ITALIA — PANNELLO DI CONTROLLO</span>
      <span style="color: #cbd5e1; font-weight: normal;">• LIVE & 3H PREDICTIVE ADVECTION</span>
    </div>
    <div class="tracker-nav">
      <a href="#" class="tracker-btn active">🏠 Pannello Controllo</a>
      <a href="https://sites.google.com/view/nowcasting-italia/satellite-infrarosso" class="tracker-btn">🛰 Satellite IR</a>
      <a href="https://sites.google.com/view/nowcasting-italia/cape-italia" class="tracker-btn">⚡ CAPE Italia</a>
      <a href="https://sites.google.com/view/nowcasting-italia/global-lightning-detector" class="tracker-btn">⚡ Lightning</a>
      <a href="https://19francomenenti73-dev.github.io/archivio-eventi/" target="_blank" class="tracker-btn" style="background-color: #1e3a8a; border-color: #3b82f6;">📍 Archivio Eventi</a>
    </div>
  </div>

  <!-- Contenitore Mappa -->
  <div id="map"></div>

  <script>
    // Inizializzazione mappa
    var map = L.map('map', {
      zoomControl: false
    }).setView([42.3, 12.5], 6);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Layer cartografico a rilievo fisico Esri (Snow Tracker style)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: US National Park Service',
      maxZoom: 9
    }).addTo(map);
  </script>

</body>
</html>
