<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia - Storm Tracker Reale</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map-wrapper, #map {
      width: 100%;
      height: 100%;
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    
    #map-wrapper { position: relative; }
    
    /* Banner superiore regioni */
    .regions-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 680px;
      margin: 0 auto;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 8px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .region-row {
      display: flex;
      justify-content: space-between;
      gap: 2px;
      width: 100%;
    }
    .reg-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 4px 1px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .reg-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .reg-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    /* Box di stato */
    .status-box {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
    }
    .status-box a { color: #38bdf8; text-decoration: none; }
    .active-cells-count { color: #38bdf8; font-weight: 700; }

    /* Legenda */
    .legend-box {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 10px;
    }
    .legend-title { font-weight: 700; color: #cbd5e1; margin-bottom: 4px; text-transform: uppercase; font-size: 9px; }
    .legend-gradient {
      display: flex;
      height: 8px;
      width: 120px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 3px;
      background: linear-gradient(to right, #0000ff, #0099ff, #00ff00, #ffff00, #ff9900, #ff0000, #cc00cc);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 8px;
      font-weight: 600;
    }

    /* Popup Scheda Cella */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      padding: 4px;
    }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
    .cell-card {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      min-width: 200px;
    }
    .cell-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 5px;
      margin-bottom: 6px;
    }
    .cell-card-title { font-weight: 700; color: #38bdf8; font-size: 12px; }
    .cell-badge { color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .cell-metric-row { display: flex; justify-content: space-between; margin-bottom: 4px; line-height: 1.3; }
    .cell-metric-label { color: #94a3b8; }
    .cell-metric-value { font-weight: 600; color: #f1f5f9; text-align: right; }
    .eta-highlight { color: #38bdf8 !important; font-weight: 700 !important; }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <!-- Banner superiore regioni -->
    <div class="regions-container">
      <div class="region-row">
        <button class="reg-btn active" onclick="setRegion('italia', this)">🇮🇹 Italia</button>
        <button class="reg-btn" onclick="setRegion('piemonte', this)">Piemonte</button>
        <button class="reg-btn" onclick="setRegion('lombardia', this)">Lombardia</button>
        <button class="reg-btn" onclick="setRegion('veneto', this)">Veneto</button>
        <button class="reg-btn" onclick="setRegion('trentino', this)">Trentino</button>
        <button class="reg-btn" onclick="setRegion('friuli', this)">Friuli</button>
        <button class="reg-btn" onclick="setRegion('liguria', this)">Liguria</button>
        <button class="reg-btn" onclick="setRegion('emilia', this)">Emilia</button>
      </div>
      <div class="region-row">
        <button class="reg-btn" onclick="setRegion('toscana', this)">Toscana</button>
        <button class="reg-btn" onclick="setRegion('lazio', this)">Lazio</button>
        <button class="reg-btn" onclick="setRegion('campania', this)">Campania</button>
        <button class="reg-btn" onclick="setRegion('abruzzo', this)">Abruzzo</button>
        <button class="reg-btn" onclick="setRegion('puglia', this)">Puglia</button>
        <button class="reg-btn" onclick="setRegion('calabria', this)">Calabria</button>
        <button class="reg-btn" onclick="setRegion('sicilia', this)">Sicilia</button>
        <button class="reg-btn" onclick="setRegion('sardegna', this)">Sardegna</button>
      </div>
    </div>

    <!-- Box di stato -->
    <div class="status-box" id="status-display">
      <div><b>Radar Live:</b> Scansione Pixel Zoom 6...</div>
      <div>Celle Reali (≥32 dBZ): <span id="cell-count" class="active-cells-count">0</span></div>
      <div style="font-size:8px; color:#94a3b8; margin-top:2px;">Elaborazione Pixel Canvas RainViewer</div>
    </div>

    <!-- Legenda -->
    <div class="legend-box">
      <div class="legend-title">Riflettività (dBZ)</div>
      <div class="legend-gradient"></div>
      <div class="legend-labels">
        <span>0</span>
        <span>20</span>
        <span>30</span>
        <span>40</span>
        <span>50</span>
        <span>60</span>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const regions = {
      italia: { center: [42.5, 12.5], zoom: 6 },
      piemonte: { center: [45.07, 7.68], zoom: 8 },
      lombardia: { center: [45.46, 9.19], zoom: 8 },
      veneto: { center: [45.43, 11.33], zoom: 8 },
      trentino: { center: [46.22, 11.12], zoom: 8 },
      friuli: { center: [46.06, 13.23], zoom: 8 },
      liguria: { center: [44.40, 8.93], zoom: 8 },
      emilia: { center: [44.49, 11.34], zoom: 8 },
      toscana: { center: [43.76, 11.25], zoom: 8 },
      lazio: { center: [41.90, 12.49], zoom: 8 },
      campania: { center: [40.85, 14.26], zoom: 8 },
      abruzzo: { center: [42.35, 13.39], zoom: 8 },
      puglia: { center: [41.11, 16.87], zoom: 8 },
      calabria: { center: [39.00, 16.50], zoom: 8 },
      sicilia: { center: [37.59, 14.01], zoom: 7 },
      sardegna: { center: [40.12, 9.01], zoom: 7 }
    };

    const map = L.map('map', {
      center: regions.italia.center,
      zoom: regions.italia.zoom,
      minZoom: 5,
      maxZoom: 12,
      worldCopyJump: true,
      attributionControl: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      subdomains: ['a', 'b', 'c'],
      maxZoom: 19,
      minZoom: 5,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let radarLayer = null;
    let stormCellsGroup = L.layerGroup().addTo(map);

    function setRegion(key, btn) {
      document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = regions[key];
      if (target) map.flyTo(target.center, target.zoom, { duration: 1.2 });
    }

    // Conversione da coordinate globale Pixel a Lat/Lon (Zoom 6, Tile 256px)
    function pixelToLatLon(globalX, globalY, zoom) {
      const totalPixels = 256 * Math.pow(2, zoom);
      const lon = (globalX / totalPixels) * 360 - 180;
      const latRad = Math.atan(Math.sinh(Math.PI * (1 - (2 * globalY) / totalPixels)));
      const lat = (latRad * 180) / Math.PI;
      return { lat, lon };
    }

    // Mappatura colore RGBA -> dBZ per Palette RainViewer
    function getDbzFromRgba(r, g, b, a) {
      if (a < 30) return 0;
      if (r > 180 && g > 180 && b < 100) return 36; // Giallo (32-38 dBZ)
      if (r > 200 && g >= 100 && g <= 180 && b < 100) return 44; // Arancione (40-46 dBZ)
      if (r > 200 && g < 100 && b < 100) return 52; // Rosso (48-54 dBZ)
      if (r > 150 && g < 80 && b > 150) return 60; // Viola/Magenta (55+ dBZ)
      return 0;
    }

    // Carica e processa le tile a Zoom 6 per l'Italia (x: 33..35, y: 22..25)
    async function scanRadarTilesForCells(path) {
      const zoom = 6;
      const xTiles = [33, 34, 35];
      const yTiles = [22, 23, 24, 25];
      const points = [];

      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const promises = [];

      xTiles.forEach(tx => {
        yTiles.forEach(ty => {
          const url = `https://tilecache.rainviewer.com${path}/256/${zoom}/${tx}/${ty}/2/1_1.png`;
          const p = new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
              ctx.clearRect(0, 0, 256, 256);
              ctx.drawImage(img, 0, 0);
              const imgData = ctx.getImageData(0, 0, 256, 256).data;

              for (let py = 0; py < 256; py += 4) {
                for (let px = 0; px < 256; px += 4) {
                  const idx = (py * 256 + px) * 4;
                  const r = imgData[idx];
                  const g = imgData[idx + 1];
                  const b = imgData[idx + 2];
                  const a = imgData[idx + 3];

                  const dbz = getDbzFromRgba(r, g, b, a);
                  if (dbz >= 32) {
                    const gx = tx * 256 + px;
                    const gy = ty * 256 + py;
                    const coords = pixelToLatLon(gx, gy, zoom);
                    points.push({ lat: coords.lat, lon: coords.lon, dbz: dbz });
                  }
                }
              }
              resolve();
            };
            img.onerror = () => resolve();
            img.src = url;
          });
          promises.push(p);
        });
      });

      await Promise.all(promises);
      return clusterPointsToCells(points);
    }

    // Algoritmo di clustering
    function clusterPointsToCells(points) {
      const clusters = [];
      const threshold = 0.25;

      points.forEach(p => {
        let matched = false;
        for (let c of clusters) {
          const d = Math.hypot(c.lat - p.lat, c.lon - p.lon);
          if (d < threshold) {
            c.pts.push(p);
            c.sumLat += p.lat;
            c.sumLon += p.lon;
            if (p.dbz > c.maxDbz) c.maxDbz = p.dbz;
            matched = true;
            break;
          }
        }
        if (!matched) {
          clusters.push({
            pts: [p],
            sumLat: p.lat,
            sumLon: p.lon,
            maxDbz: p.dbz
          });
        }
      });

      return clusters.map((c, index) => {
        const lat = c.sumLat / c.pts.length;
        const lon = c.sumLon / c.pts.length;
        return {
          id: `CELL-${String(index + 1).padStart(2, '0')}`,
          lat: lat,
          lon: lon,
          maxDbz: c.maxDbz,
          pixelCount: c.pts.length
        };
      });
    }

    async function loadRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past || data.radar.past.length === 0) return;

        const pastFrames = data.radar.past;
        const latestFrame = pastFrames[pastFrames.length - 1];
        const prevFrame = pastFrames.length > 1 ? pastFrames[pastFrames.length - 2] : null;

        if (radarLayer) map.removeLayer(radarLayer);

        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.85,
          tileSize: 256,
          maxZoom: 12,
          maxNativeZoom: 6
        });
        radarLayer.on('tileerror', e => e.tile.style.display = 'none');
        radarLayer.addTo(map);

        const timeStr = new Date(latestFrame.time * 1000).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

        const currentCells = await scanRadarTilesForCells(latestFrame.path);
        
        let prevCells = [];
        let dtMinutes = 10;
        if (prevFrame) {
          prevCells = await scanRadarTilesForCells(prevFrame.path);
          dtMinutes = Math.max(1, Math.round((latestFrame.time - prevFrame.time) / 60));
        }

        renderRealStormCells(currentCells, prevCells, dtMinutes);
        document.getElementById('status-display').querySelector('div').innerHTML = `<b>Radar Live:</b> ${timeStr}`;

      } catch (err) {
        console.error("Errore analisi pixel radar:", err);
      }
    }

    function renderRealStormCells(cells, prevCells, dtMinutes) {
      stormCellsGroup.clearLayers();

      cells.forEach(cell => {
        let vLat = 0.1, vLon = 0.15;
        let speedKmH = 35;
        let headingDeg = 60;

        let closestPrev = null;
        let minDist = 0.6;

        prevCells.forEach(p => {
          const dist = Math.hypot(p.lat - cell.lat, p.lon - cell.lon);
          if (dist < minDist) {
            minDist = dist;
            closestPrev = p;
          }
        });

        if (closestPrev) {
          const dLat = cell.lat - closestPrev.lat;
          const dLon = cell.lon - closestPrev.lon;
          vLat = dLat * 2.5;
          vLon = dLon * 2.5;

          const distKm = Math.hypot(dLat * 111, dLon * 111 * Math.cos(cell.lat * Math.PI / 180));
          speedKmH = Math.round((distKm / dtMinutes) * 60);
          if (speedKmH < 10) speedKmH = 15;

          headingDeg = Math.round((Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360);
        }

        const startPoint = [cell.lat, cell.lon];
        const endPoint = [cell.lat + vLat, cell.lon + vLon];

        const cthKm = (2.5 + cell.maxDbz * 0.18).toFixed(1);
        const tempC = Math.round(-15 - (cell.maxDbz * 0.8));
        const etaMin = Math.round(15 + (100 / Math.max(20, speedKmH)) * 10);

        // Stima Rischio Grandine in base ai dBZ
        let hailRisk = "Basso / Assente";
        let hailColor = "#38bdf8";
        if (cell.maxDbz >= 55) {
          hailRisk = "Molto Alto (Possibile grandine grossa)";
          hailColor = "#ef4444";
        } else if (cell.maxDbz >= 50) {
          hailRisk = "Alto (Possibile grandine moderata)";
          hailColor = "#f97316";
        } else if (cell.maxDbz >= 45) {
          hailRisk = "Moderato (Possibile grandine piccola)";
          hailColor = "#eab308";
        }

        const badgeColor = cell.maxDbz >= 50 ? '#ef4444' : (cell.maxDbz >= 40 ? '#f97316' : '#eab308');

        const vectorLine = L.polyline([startPoint, endPoint], {
          color: badgeColor,
          weight: 2,
          dashArray: '4, 4',
          opacity: 0.9
        });

        const vectorHead = L.circleMarker(endPoint, {
          radius: 3,
          color: badgeColor,
          fillColor: badgeColor,
          fillOpacity: 1
        });

        const cellCircle = L.circleMarker(startPoint, {
          radius: Math.max(8, Math.min(16, cell.pixelCount)),
          color: badgeColor,
          weight: 2,
          fillColor: badgeColor,
          fillOpacity: 0.45
        });

        const popupContent = `
          <div class="cell-card">
            <div class="cell-card-header">
              <span class="cell-card-title">${cell.id} (Reale)</span>
              <span class="cell-badge" style="background:${badgeColor}">${cell.maxDbz} dBZ</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">ETA Impatto Stimato:</span>
              <span class="cell-metric-value eta-highlight">+${etaMin} min</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Altezza Nubi (CTH):</span>
              <span class="cell-metric-value">${cthKm} km (${tempC}°C)</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Velocità Reale:</span>
              <span class="cell-metric-value">${speedKmH} km/h</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Direzione Vettore:</span>
              <span class="cell-metric-value">${headingDeg}° (Azimut)</span>
            </div>
            <div class="cell-metric-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px; padding-top: 4px;">
              <span class="cell-metric-label">Rischio Grandine:</span>
              <span class="cell-metric-value" style="color: ${hailColor}; font-weight:700;">${hailRisk}</span>
            </div>
          </div>
        `;

        cellCircle.bindPopup(popupContent, { closeButton: true, autoPan: true });

        stormCellsGroup.addLayer(vectorLine);
        stormCellsGroup.addLayer(vectorHead);
        stormCellsGroup.addLayer(cellCircle);
      });

      document.getElementById('cell-count').innerText = cells.length;
    }

    loadRadar();
    setInterval(loadRadar, 300000);
  </script>
</body>
</html>
