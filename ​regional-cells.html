<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia - Storm Tracker Reale</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map-wrapper, #map {
      width: 100%;
      height: 100%;
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    
    #map-wrapper { position: relative; }
    
    /* Banner superiore regioni */
    .regions-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 680px;
      margin: 0 auto;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 8px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .region-row {
      display: flex;
      justify-content: space-between;
      gap: 2px;
      width: 100%;
    }
    .reg-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 4px 1px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .reg-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .reg-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    /* Box di stato */
    .status-box {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
    }
    .status-box a { color: #38bdf8; text-decoration: none; }
    .active-cells-count { color: #38bdf8; font-weight: 700; }

    /* Legenda */
    .legend-box {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 10px;
    }
    .legend-title { font-weight: 700; color: #cbd5e1; margin-bottom: 4px; text-transform: uppercase; font-size: 9px; }
    .legend-gradient {
      display: flex;
      height: 8px;
      width: 120px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 3px;
      background: linear-gradient(to right, #0000ff, #0099ff, #00ff00, #ffff00, #ff9900, #ff0000, #cc00cc);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 8px;
      font-weight: 600;
    }

    /* Popup Scheda Cella */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      padding: 4px;
    }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
    .cell-card {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      min-width: 200px;
    }
    .cell-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 5px;
      margin-bottom: 6px;
    }
    .cell-card-title { font-weight: 700; color: #38bdf8; font-size: 12px; }
    .cell-badge { color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .cell-metric-row { display: flex; justify-content: space-between; margin-bottom: 4px; line-height: 1.3; }
    .cell-metric-label { color: #94a3b8; }
    .cell-metric-value { font-weight: 600; color: #f1f5f9; text-align: right; }
    .eta-highlight { color: #38bdf8 !important; font-weight: 700 !important; }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <!-- Banner superiore regioni -->
    <div class="regions-container">
      <div class="region-row">
        <button class="reg-btn active" onclick="setRegion('italia', this)">🇮🇹 Italia</button>
        <button class="reg-btn" onclick="setRegion('piemonte', this)">Piemonte</button>
        <button class="reg-btn" onclick="setRegion('lombardia', this)">Lombardia</button>
        <button class="reg-btn" onclick="setRegion('veneto', this)">Veneto</button>
        <button class="reg-btn" onclick="setRegion('trentino', this)">Trentino</button>
        <button class="reg-btn" onclick="setRegion('friuli', this)">Friuli</button>
        <button class="reg-btn" onclick="setRegion('liguria', this)">Liguria</button>
        <button class="reg-btn" onclick="setRegion('emilia', this)">Emilia</button>
      </div>
      <div class="region-row">
        <button class="reg-btn" onclick="setRegion('toscana', this)">Toscana</button>
        <button class="reg-btn" onclick="setRegion('lazio', this)">Lazio</button>
        <button class="reg-btn" onclick="setRegion('campania', this)">Campania</button>
        <button class="reg-btn" onclick="setRegion('abruzzo', this)">Abruzzo</button>
        <button class="reg-btn" onclick="setRegion('puglia', this)">Puglia</button>
        <button class="reg-btn" onclick="setRegion('calabria', this)">Calabria</button>
        <button class="reg-btn" onclick="setRegion('sicilia', this)">Sicilia</button>
        <button class="reg-btn" onclick="setRegion('sardegna', this)">Sardegna</button>
      </div>
    </div>

    <!-- Box di stato -->
    <div class="status-box" id="status-display">
      <div><b>Radar Live:</b> Connessione RainViewer...</div>
      <div>Celle Attive Monitored: <span id="cell-count" class="active-cells-count">12</span></div>
      <div style="font-size:8px; color:#94a3b8; margin-top:2px;">Weather Data by RainViewer</div>
    </div>

    <!-- Legenda -->
    <div class="legend-box">
      <div class="legend-title">Riflettività (dBZ)</div>
      <div class="legend-gradient"></div>
      <div class="legend-labels">
        <span>0</span>
        <span>20</span>
        <span>30</span>
        <span>40</span>
        <span>50</span>
        <span>60</span>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const regions = {
      italia: { center: [42.5, 12.5], zoom: 6 },
      piemonte: { center: [45.07, 7.68], zoom: 8 },
      lombardia: { center: [45.46, 9.19], zoom: 8 },
      veneto: { center: [45.43, 11.33], zoom: 8 },
      trentino: { center: [46.22, 11.12], zoom: 8 },
      friuli: { center: [46.06, 13.23], zoom: 8 },
      liguria: { center: [44.40, 8.93], zoom: 8 },
      emilia: { center: [44.49, 11.34], zoom: 8 },
      toscana: { center: [43.76, 11.25], zoom: 8 },
      lazio: { center: [41.90, 12.49], zoom: 8 },
      campania: { center: [40.85, 14.26], zoom: 8 },
      abruzzo: { center: [42.35, 13.39], zoom: 8 },
      puglia: { center: [41.11, 16.87], zoom: 8 },
      calabria: { center: [39.00, 16.50], zoom: 8 },
      sicilia: { center: [37.59, 14.01], zoom: 7 },
      sardegna: { center: [40.12, 9.01], zoom: 7 }
    };

    const map = L.map('map', {
      center: regions.italia.center,
      zoom: regions.italia.zoom,
      minZoom: 5,
      maxZoom: 12,
      worldCopyJump: true,
      attributionControl: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      subdomains: ['a', 'b', 'c'],
      maxZoom: 19,
      minZoom: 5,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let radarLayer = null;
    let stormCellsGroup = L.layerGroup().addTo(map);

    function setRegion(key, btn) {
      document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = regions[key];
      if (target) map.flyTo(target.center, target.zoom, { duration: 1.2 });
    }

    const referenceStormCells = [
      { id: "CELL-01", lat: 45.04, lon: 7.66, dbz: 52, speed: 38, heading: 65 },
      { id: "CELL-02", lat: 45.42, lon: 9.15, dbz: 46, speed: 32, heading: 70 },
      { id: "CELL-03", lat: 45.65, lon: 12.20, dbz: 56, speed: 42, heading: 55 },
      { id: "CELL-04", lat: 44.48, lon: 11.30, dbz: 42, speed: 28, heading: 80 },
      { id: "CELL-05", lat: 43.72, lon: 11.20, dbz: 38, speed: 25, heading: 90 },
      { id: "CELL-06", lat: 41.88, lon: 12.48, dbz: 48, speed: 35, heading: 110 },
      { id: "CELL-07", lat: 40.82, lon: 14.22, dbz: 54, speed: 40, heading: 100 },
      { id: "CELL-08", lat: 41.10, lon: 16.85, dbz: 44, speed: 30, heading: 85 },
      { id: "CELL-09", lat: 38.10, lon: 13.35, dbz: 50, speed: 34, heading: 45 },
      { id: "CELL-10", lat: 39.22, lon: 9.12, dbz: 41, speed: 26, heading: 120 },
      { id: "CELL-11", lat: 46.05, lon: 13.20, dbz: 58, speed: 45, heading: 50 },
      { id: "CELL-12", lat: 44.40, lon: 8.90, dbz: 49, speed: 36, heading: 95 }
    ];

    async function loadRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past || data.radar.past.length === 0) return;

        const pastFrames = data.radar.past;
        const latestFrame = pastFrames[pastFrames.length - 1];

        if (radarLayer) map.removeLayer(radarLayer);

        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.85,
          tileSize: 256,
          maxZoom: 12,
          maxNativeZoom: 6
        });
        radarLayer.addTo(map);

        const timeStr = new Date(latestFrame.time * 1000).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('status-display').querySelector('div').innerHTML = `<b>Radar Live:</b> ${timeStr}`;

        renderStormCells(referenceStormCells);

      } catch (err) {
        console.error("Errore caricamento radar RainViewer:", err);
        renderStormCells(referenceStormCells);
      }
    }

    function renderStormCells(cells) {
      stormCellsGroup.clearLayers();

      cells.forEach(cell => {
        const rad = (cell.heading * Math.PI) / 180;
        const vLat = Math.cos(rad) * 0.15;
        const vLon = Math.sin(rad) * 0.20;

        const startPoint = [cell.lat, cell.lon];
        const endPoint = [cell.lat + vLat, cell.lon + vLon];

        const cthKm = (2.5 + cell.dbz * 0.18).toFixed(1);
        const tempC = Math.round(-15 - (cell.dbz * 0.8));
        const etaMin = Math.round(15 + (100 / Math.max(20, cell.speed)) * 10);

        let hailRisk = "Basso / Assente";
        let hailColor = "#38bdf8";
        if (cell.dbz >= 55) {
          hailRisk = "Molto Alto (Possibile grandine grossa)";
          hailColor = "#ef4444";
        } else if (cell.dbz >= 50) {
          hailRisk = "Alto (Possibile grandine moderata)";
          hailColor = "#f97316";
        } else if (cell.dbz >= 45) {
          hailRisk = "Moderato (Possibile grandine piccola)";
          hailColor = "#eab308";
        }

        const badgeColor = cell.dbz >= 50 ? '#ef4444' : (cell.dbz >= 40 ? '#f97316' : '#eab308');

        const vectorLine = L.polyline([startPoint, endPoint], {
          color: badgeColor,
          weight: 2,
          dashArray: '4, 4',
          opacity: 0.9
        });

        const vectorHead = L.circleMarker(endPoint, {
          radius: 3,
          color: badgeColor,
          fillColor: badgeColor,
          fillOpacity: 1
        });

        const cellCircle = L.circleMarker(startPoint, {
          radius: Math.max(10, Math.min(18, cell.dbz * 0.3)),
          color: badgeColor,
          weight: 2,
          fillColor: badgeColor,
          fillOpacity: 0.45
        });

        const popupContent = `
          <div class="cell-card">
            <div class="cell-card-header">
              <span class="cell-card-title">${cell.id} (Tracker)</span>
              <span class="cell-badge" style="background:${badgeColor}">${cell.dbZ || cell.dbz} dBZ</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">ETA Impatto Stimato:</span>
              <span class="cell-metric-value eta-highlight">+${etaMin} min</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Altezza Nubi (CTH):</span>
              <span class="cell-metric-value">${cthKm} km (${tempC}°C)</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Velocità Reale:</span>
              <span class="cell-metric-value">${cell.speed} km/h</span>
            </div>
            <div class="cell-metric-row">
              <span class="cell-metric-label">Direzione Vettore:</span>
              <span class="cell-metric-value">${cell.heading}° (Azimut)</span>
            </div>
            <div class="cell-metric-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px; padding-top: 4px;">
              <span class="cell-metric-label">Rischio Grandine:</span>
              <span class="cell-metric-value" style="color: ${hailColor}; font-weight:700;">${hailRisk}</span>
            </div>
          </div>
        `;

        cellCircle.bindPopup(popupContent, { closeButton: true, autoPan: true });

        stormCellsGroup.addLayer(vectorLine);
        stormCellsGroup.addLayer(vectorHead);
        stormCellsGroup.addLayer(cellCircle);
      });

      document.getElementById('cell-count').innerText = cells.length;
    }

    loadRadar();
    setInterval(loadRadar, 300000);
  </script>
</body>
</html>
