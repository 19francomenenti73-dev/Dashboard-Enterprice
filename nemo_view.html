<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.E.M.O. Engine - Nowcasting Italia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #030712; font-family: system-ui, -apple-system, sans-serif; color: #f3f4f6; overflow: hidden; display: flex; flex-direction: column; }
    
    #nemo-map { width: 100%; flex: 1; background: #000; z-index: 1; }

    /* Barra Informativa Crediti Open Data */
    .nemo-info-bar {
      background: rgba(8, 14, 28, 0.95);
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 10px;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .nemo-title {
      color: #00f0ff;
      font-weight: 800;
      text-transform: uppercase;
    }

    .open-credits {
      color: #9ca3af;
      font-size: 9px;
    }

    .open-credits span {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div id="nemo-map"></div>

  <div class="nemo-info-bar">
    <div>
      <span class="nemo-title">⚡ N.E.M.O. Engine v1.0</span>
      <span class="open-credits"> | Open Data: <span>RainViewer API</span> (Radar), <span>Open-Meteo</span> (Upper Air), <span>Copernicus DEM</span></span>
    </div>
    <div id="status-tag" style="color:#4ade80; font-weight:bold;">● LIVE</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('nemo-map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CARTO &copy; RainViewer Open Data',
      maxZoom: 18
    }).addTo(map);

    // Caricamento del GeoJSON generato dal backend
    fetch('nemo_data/data/nemo_tracker_live.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
            radius: 8,
            fillColor: '#00f0ff',
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
          }),
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              const p = feature.properties;
              layer.bindPopup(`
                <div style="font-family:sans-serif; font-size:11px; color:#111;">
                  <b>⚡ ${p.name || 'Cellula Convettiva'}</b><br>
                  Echo Top: ${p.echo_top || 'N.D.'} km<br>
                  VIL: ${p.vil || 'N.D.'} kg/m²<br>
                  Velocità: ${p.speed || 'N.D.'} km/h
                </div>
              `);
            }
          }
        }).addTo(map);
      })
      .catch(err => {
        console.log("In attesa di primo sync dati NEMO...");
      });
  </script>
</body>
</html>
