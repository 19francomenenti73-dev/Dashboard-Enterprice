<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.E.M.O. Engine - Nowcasting Italia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #030712; font-family: system-ui, -apple-system, sans-serif; color: #f3f4f6; overflow: hidden; display: flex; flex-direction: column; }
    
    #nemo-map { width: 100%; flex: 1; background: #111827; z-index: 1; }

    /* Barra Informativa Crediti Open Data */
    .nemo-info-bar {
      background: rgba(8, 14, 28, 0.95);
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 10px;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .nemo-title {
      color: #00f0ff;
      font-weight: 800;
      text-transform: uppercase;
    }

    .open-credits {
      color: #9ca3af;
      font-size: 9px;
    }

    .open-credits span {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div id="nemo-map"></div>

  <div class="nemo-info-bar">
    <div>
      <span class="nemo-title">⚡ N.E.M.O. Engine v1.0</span>
      <span class="open-credits"> | Open Data: <span>RainViewer API</span> (Radar), <span>Open-Meteo</span> (Upper Air), <span>Copernicus DEM</span></span>
    </div>
    <div id="status-tag" style="color:#4ade80; font-weight:bold;">● LIVE</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Mappa centrata sull'Italia
    const map = L.map('nemo-map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Mappa Base Esri World Topo (100% stabile, pubblica, senza API key e senza errori scuri)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Open Data: RainViewer, Open-Meteo, Copernicus',
      maxZoom: 18
    }).addTo(map);

    // Layer per i vettori e i centroidi reali
    let nemoLayerGroup = L.layerGroup().addTo(map);

    function loadNemoRealData() {
      fetch('nemo_data/data/nemo_tracker_live.geojson?t=' + new Date().getTime())
        .then(res => {
          if (!res.ok) throw new Error("Nessun dato attivo");
          return res.json();
        })
        .then(data => {
          nemoLayerGroup.clearLayers();
          
          if (!data || !data.features || data.features.length === 0) {
            document.getElementById('status-tag').innerText = "● LIVE (Nessun temporale attivo)";
            document.getElementById('status-tag').style.color = "#4ade80";
            return;
          }

          L.geoJSON(data, {
            style: function(feature) {
              // Gestione stili dei vettori storici e predittivi
              if (feature.geometry.type === 'LineString') {
                const isPredictive = feature.properties && feature.properties.type === 'forecast';
                return {
                  color: isPredictive ? '#00f0ff' : '#3b82f6',
                  weight: isPredictive ? 2 : 3,
                  dashArray: isPredictive ? '5, 5' : null,
                  opacity: 0.9
                };
              }
            },
            pointToLayer: function(feature, latlng) {
              // Centroidi reali
              return L.circleMarker(latlng, {
                radius: 7,
                fillColor: '#00f0ff',
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
              });
            },
            onEachFeature: function(feature, layer) {
              if (feature.properties && feature.properties.name) {
                const p = feature.properties;
                layer.bindPopup(`
                  <div style="font-family:sans-serif; font-size:11px; color:#111;">
                    <b style="color:#0284c7; font-size:12px;">⚡ ${p.name}</b><br>
                    <b>Echo Top:</b> ${p.echo_top || 'N.D.'} km<br>
                    <b>VIL:</b> ${p.vil || 'N.D.'} kg/m²<br>
                    <b>Struttura:</b> ${p.structure || 'N.D.'}<br>
                    <b>Velocità:</b> ${p.speed || 'N.D.'} km/h
                  </div>
                `);
              }
            }
          }).addTo(nemoLayerGroup);

          document.getElementById('status-tag').innerText = `● LIVE (${data.features.length} elementi reali)`;
          document.getElementById('status-tag').style.color = "#00f0ff";
        })
        .catch(err => {
          document.getElementById('status-tag').innerText = "● LIVE (Nessun temporale attivo)";
          document.getElementById('status-tag').style.color = "#4ade80";
        });
    }

    // Carica i dati reali al primo avvio
    loadNemoRealData();
  </script>
</body>
</html>
